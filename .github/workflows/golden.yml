# HE-048 / doc 08 §A8-A9: the LLM golden set, once per provider (billed).
# Keys come from repository secrets; a provider whose secret is unset is skipped with a
# warning (so the run is visibly incomplete, never silently green).
name: Golden set

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/workers/extraction/**"
      - "services/common/llm/**"
      - "services/tests/golden/**"
      - "services/tests/test_golden.py"

permissions:
  contents: read

concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: Golden set - ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: gemini
            secret: GOLDEN_GEMINI_API_KEY
            model_var: GOLDEN_GEMINI_MODEL
          - provider: anthropic
            secret: GOLDEN_ANTHROPIC_API_KEY
            model_var: GOLDEN_ANTHROPIC_MODEL
          - provider: openai_compatible
            secret: GOLDEN_OPENAI_API_KEY
            model_var: GOLDEN_OPENAI_MODEL
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hackevents
          POSTGRES_PASSWORD: ci-test
          POSTGRES_DB: hackevents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hackevents -d hackevents"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://hackevents:ci-test@localhost:5432/hackevents
      TEST_REDIS_URL: redis://localhost:6379/0
      GOLDEN_PROVIDER: ${{ matrix.provider }}
      GOLDEN_API_KEY: ${{ secrets[matrix.secret] }}
      GOLDEN_MODEL: ${{ vars[matrix.model_var] }}
      GOLDEN_BASE_URL: ${{ matrix.provider == 'openai_compatible' && vars.GOLDEN_OPENAI_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check provider secret
        id: have
        run: |
          if [ -z "$GOLDEN_API_KEY" ] || [ -z "$GOLDEN_MODEL" ]; then
            echo "::warning::${{ matrix.provider }}: secret ${{ matrix.secret }} or variable ${{ matrix.model_var }} not set; golden set NOT run for this provider"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.have.outputs.run == 'true'
        with:
          version: "0.12.13"
          python-version: "3.12"
      - if: steps.have.outputs.run == 'true'
        run: uv sync --frozen
      - if: steps.have.outputs.run == 'true'
        run: GOLDEN_REPORT="$RUNNER_TEMP/golden-$GOLDEN_PROVIDER.json" uv run pytest -m golden -s services/tests/test_golden.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.have.outputs.run == 'true'
        with:
          name: golden-${{ matrix.provider }}
          path: ${{ runner.temp }}/golden-${{ matrix.provider }}.json
          if-no-files-found: ignore
