# Build both images natively on GitHub's free arm64 runners and push them to GHCR, so the Oracle
# Ampere (arm64) server can pull them instead of building. Runbook Part B.
# Third-party actions are pinned to full commit SHAs; the comment names the release (same as ci.yml).
# Runs only on pushes to main and by hand: never on pull requests, so a fork can't reach the token.
# ponytail: publishes on every push to main, in parallel with CI. Gate it behind CI with a
# workflow_run trigger if a red main ever needs to be kept off the server.
name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publish half-way through a push.
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }} (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # the only job that can write to the registry, using the built-in token
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hackevents-web
            dockerfile: apps/web/Dockerfile
          - image: hackevents-services
            dockerfile: services/Dockerfile
          - image: hackevents-browser
            dockerfile: services/Dockerfile
            target: browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR names must be lowercase. Only GitHub-provided values reach the shell.
      - name: Image name and tag
        id: meta
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
