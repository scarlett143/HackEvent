[project]
name = "hackevents-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "pydantic-settings>=2.16.3",
    "redis>=5",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.16.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261113",
    "pytest-asyncio>=1.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["services/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["api", "workers", "common"]

[tool.mypy]
mypy_path = "services"
explicit_package_bases = true
strict = true
